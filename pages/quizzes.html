<!-- ===== HALAMAN KUIS & MATERI ===== -->
<div id="page-quizzes" class="page-section">
  <div class="section-header">
    <div>
      <h2><span class="material-icons" style="font-size:22px;vertical-align:middle">menu_book</span> Kuis &amp; Materi</h2>
      <p>CRUD materi per era</p>
    </div>
  </div>
  <div class="table-card">
    <div class="table-toolbar">
      <div class="search-box">
        <input type="text" id="search-materials" placeholder="Cari judul materi..." oninput="filterTable('materials')">
      </div>
      <select class="filter-select" id="filter-materials-era" onchange="filterTable('materials')">
        <option value="">Semua Era</option>
      </select>
      <div class="ml-auto">
        <button class="btn btn-primary btn-sm" onclick="openModal('material')">
          <span class="material-icons" style="font-size:15px;vertical-align:middle">add</span> Tambah Materi
        </button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th onclick="sortTable('materials','order_number')"># <span class="sort-arrow">↕</span></th>
            <th onclick="sortTable('materials','era_title')">Era <span class="sort-arrow">↕</span></th>
            <th onclick="sortTable('materials','title')">Judul Materi <span class="sort-arrow">↕</span></th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="table-materials"><tr class="loading-row"><td colspan="4">Memuat data...</td></tr></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination-materials"></div>
  </div>
</div>
