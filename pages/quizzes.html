<!-- ===== HALAMAN KUIS & MATERI ===== -->
<div id="page-quizzes" class="page-section">
  <div class="section-header">
    <div>
      <h2><span class="material-icons" style="font-size:22px;vertical-align:middle">quiz</span> Kuis &amp; Materi</h2>
      <p>CRUD kuis per era</p>
    </div>
  </div>
  <div class="table-card">
    <div class="table-toolbar">
      <div class="search-box">
        <input type="text" id="search-quizzes" placeholder="Cari judul kuis..." oninput="filterTable('quizzes')">
      </div>
      <select class="filter-select" id="filter-quizzes-cat" onchange="filterTable('quizzes')">
        <option value="">Semua Kategori</option>
        <option value="sejarah">Sejarah</option>
        <option value="budaya">Budaya</option>
        <option value="pahlawan">Pahlawan</option>
      </select>
      <select class="filter-select" id="filter-quizzes-locked" onchange="filterTable('quizzes')">
        <option value="">Semua Status</option>
        <option value="false">Aktif</option>
        <option value="true">Terkunci</option>
      </select>
      <div class="ml-auto">
        <button class="btn btn-primary btn-sm" onclick="openModal('quiz')">
          <span class="material-icons" style="font-size:15px;vertical-align:middle">add</span> Tambah Kuis
        </button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th onclick="sortTable('quizzes','order_number')"># <span class="sort-arrow">↕</span></th>
            <th onclick="sortTable('quizzes','title')">Judul <span class="sort-arrow">↕</span></th>
            <th onclick="sortTable('quizzes','category')">Kategori <span class="sort-arrow">↕</span></th>
            <th onclick="sortTable('quizzes','mode')">Mode <span class="sort-arrow">↕</span></th>
            <th onclick="sortTable('quizzes','age')">Usia <span class="sort-arrow">↕</span></th>
            <th onclick="sortTable('quizzes','rating')">Rating <span class="sort-arrow">↕</span></th>
            <th onclick="sortTable('quizzes','participants_count')">Peserta <span class="sort-arrow">↕</span></th>
            <th onclick="sortTable('quizzes','is_locked')">Status <span class="sort-arrow">↕</span></th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="table-quizzes"><tr class="loading-row"><td colspan="9">Memuat data...</td></tr></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination-quizzes"></div>
  </div>
</div>
