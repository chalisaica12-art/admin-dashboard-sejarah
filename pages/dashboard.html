<!-- ===== HALAMAN DASHBOARD ===== -->
<div id="page-dashboard" class="page-section active">
  <div class="section-header">
    <div>
      <h2><span class="material-icons" style="font-size:22px;vertical-align:middle">waving_hand</span> Selamat Datang, Admin!</h2>
      <p>Ringkasan data aplikasi Perjalanan Sejarah Indonesia</p>
    </div>
    <button class="btn btn-primary" onclick="loadDashboard()">
      <span class="material-icons" style="font-size:15px;vertical-align:middle">refresh</span> Refresh
    </button>
  </div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Total Pengguna</div><div class="stat-val" id="stat-users">—</div><div class="stat-desc">Terdaftar</div></div>
    <div class="stat-card"><div class="stat-label">Total Kuis</div><div class="stat-val" id="stat-quizzes">—</div><div class="stat-desc">Aktif</div></div>
    <div class="stat-card"><div class="stat-label">Total Soal</div><div class="stat-val" id="stat-questions">—</div><div class="stat-desc">Di semua era</div></div>
    <div class="stat-card"><div class="stat-label">Skor Dimainkan</div><div class="stat-val" id="stat-scores">—</div><div class="stat-desc">Total sesi</div></div>
    <div class="stat-card"><div class="stat-label">Avatar</div><div class="stat-val" id="stat-avatars">—</div><div class="stat-desc">Tersedia</div></div>
  </div>
  <div class="table-card">
    <div class="table-toolbar">
      <strong style="font-size:14px;">
        <span class="material-icons" style="font-size:16px;vertical-align:middle">list_alt</span> Aktivitas Terbaru (Skor)
      </strong>
    </div>
    <table>
      <thead>
        <tr><th>#</th><th>User ID</th><th>Skor</th><th>Benar</th><th>Total</th><th>Bintang</th><th>Dimainkan</th></tr>
      </thead>
      <tbody id="recent-scores">
        <tr class="loading-row"><td colspan="7">Memuat data...</td></tr>
      </tbody>
    </table>
  </div>
</div>
